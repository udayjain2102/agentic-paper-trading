# Guardrail limits. Conservative defaults — tighten before going live.
# All dollar amounts are USD.

limits:
  # Max dollars committed to any single order.
  per_trade_max_usd: 250

  # Max total dollars deployed across all positions. New buys that would push
  # total position value above this are rejected.
  total_deployed_max_usd: 2000

  # Max number of *new* positions (symbols not already held) opened per run.
  max_new_positions_per_run: 2

  # Max number of orders (buys + sells) placed per run. Rate limit.
  max_orders_per_run: 5

  # Daily realized-loss kill switch. If realized P&L for the day is at or below
  # negative this value, the agent halts for the rest of the day.
  daily_loss_limit_usd: 200

# Model configuration for the decision agent.
# Served by NVIDIA's OpenAI-compatible API (integrate.api.nvidia.com).
agent:
  model: nvidia/nemotron-3.5-super-vl-120b-a12b
  # Third decider. nvidia/nemotron-3-super-120b-a12b stopped being served to
  # this account on 2026-10-19 (HTTP 404 "Function ... not found for account",
  # though still in the public catalog); every agent decision failed until
  # this switch on 2026-11-12. Verified live that day: one call with the real
  # decision prompt returned the bare JSON in 2.0s, 376 completion tokens.
  # The notes below are about the model before it.
  # nvidia/llama-3.3-nemotron-super-49b-v1.5 reached end of life on NVIDIA's
  # API (HTTP 410 from 2026-08-24; every agent decision failed until this
  # switch on 2026-09-03). nemotron-3-super with "detailed thinking off"
  # returns the bare two-field JSON in ~2s with no preamble (verified live
  # 2026-09-03). Even so, one decision on 2026-09-16 ran the full 2000-token
  # budget and was truncated, so 4000 is the headroom now; the truncation
  # guard in engine.py still fires if a call blows through this too.
  max_tokens: 4000
  # Every production AgentEngine() call previously omitted this kwarg, which
  # defaults False in engine.py -- production has run long-only since launch
  # despite the offline IC gate (which found "no signal") testing allow_short=
  # True, a config it never actually ran. Default here matches the gate.
  allow_short: true
  # When true, every prompt is prefixed with the one current lessons block in
  # journal/agent_memory.md (at most 5 bullets, rewritten by the agent after
  # each tick from its own live outcomes) and nothing else. It is still an
  # unvalidated prior. The earlier version also mixed in a sentence computed
  # from 24 papertrade runs frozen since 2026-07-15 ("losses concentrate in
  # holding=long ..."), which produced 259 flat decisions out of 260; that
  # sentence is gone from the forward prompt. Off, so the `agent` and
  # `agent_ctx` records keep measuring the naked agent until they are judged;
  # test the memory on a separate record, not by flipping this mid-record.
  use_lessons: false

# Winning strategy. Chosen by the long-only paper-trade bake-off (2026-07-13/14),
# ranked by risk-adjusted return with the robust evaluator (fold Sharpe +
# bootstrap CI + deflated Sharpe). Winner: mean-reversion, long-only, gated by the
# ConvictionGate overlay (trade only high-conviction signals).
#   overlay        point Sharpe   deflated
#   none (raw)         1.16          0.54
#   conviction         1.82          0.79   <- locked in
#   bucket             1.13          0.52
#   winprob            1.16          0.53
# Caveat: conviction's 95% CI lower bound still sits ~0, so this is the best
# candidate, not a statistically-proven edge — confirm with forward OOS data.
# The `overlay` field applies in the paper-trade evaluation path (papertrade.py);
# the conviction overlay is also wired into the forward path (forward.py) — see
# apply_conviction there. Other overlays (bucket, winprob) are paper-trade-only.
# This block is only used when the runner is invoked with STRATEGY_MODE=true; the
# default (no env var) keeps the LLM agent.
strategy:
  name: mean_reversion
  params: {}
  overlay: conviction
  # Per-side execution cost, in bps. 1bp badly understates real cost for this
  # universe; 5-10bp all-in (commission + spread + slippage) is more realistic.
  cost_bps: 7.0
  # 'close' fills a target change at the same bar's close the signal was
  # decided from -- you can't actually observe a close and trade at it
  # (flatters strategies like mean-reversion that buy dips at the dip's own
  # close). 'next_open' fills at the following bar's open instead, which you
  # genuinely can trade at. This config block is meant to be the realistic
  # basis (paired with cost_bps above), so it's next_open, not close -- pass
  # --fill-mode close explicitly if you need the old flattering comparison.
  # Exception: the original `mean_reversion` forward record (journal/forward/
  # mean_reversion/) was seeded at cost_bps=1/fill_mode=close and must stay on
  # that basis for its own life -- scripts/paper_cron.sh pins it with explicit
  # flags rather than letting it drift onto these (now more realistic) config
  # defaults. The honest go-forward number is the mean_reversion_real record.
  fill_mode: next_open
  universe: [AAPL, ABBV, ABT, ADBE, AMD, AMGN, AMZN, AVGO, AXP, BA, BAC, BLK, BMY,
    C, CAT, CMCSA, COST, CRM, CSCO, CVX, DHR, DIS, GE, GILD, GOOGL, GS, HD, HON,
    IBM, INTC, JNJ, JPM, KO, LIN, LLY, LOW, MA, MCD, MDT, META, MRK, MS, MSFT,
    NFLX, NKE, NOW, NVDA, ORCL, PEP, PFE, PG, PM, QCOM, SBUX, SPY, T, TMO, TSLA,
    TXN, UNH, UNP, V, VZ, WFC, WMT]

# Fifth forward record (agent_open): no stock list. The agent hunts the whole US
# market each day; only this tradability FLOOR (a rule, not a list) bounds it.
open_universe:
  min_price: 5.0                # last close at or above this
  min_dollar_volume: 20000000   # median close*volume over the last 20 bars
  max_positions: 10             # each position is 1/max_positions of the book
  max_candidates: 40            # names shown to the agent after its screens
